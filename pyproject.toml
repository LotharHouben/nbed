[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbed"
# dynamic = ["version"]
version="0.1.2"
description = 'A Python class for processing 4D-STEM nanodiffraction data'
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = []
authors = [
  { name = "Lothar Houben", email = "lothar.houben@gmail.com" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]


# Primary runtime dependencies required by your imports
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "scipy>=1.1.0",
    "h5py>=3.0.0",
    "hdf5plugin",
    "dask[array]>=2022.0.0",
    "psutil",
    "pims",
    "trackpy",
    "mrcfile>=1.5.0",
    "tqdm",
    "ipython",
    "ipywidgets",
    "pims>=0.7",
]


[project.urls]
Documentation = "https://github.com/LotharHouben/nbed#readme"
Issues = "https://github.com/LotharHouben/nbed/issues"
Source = "https://github.com/LotharHouben/nbed"


